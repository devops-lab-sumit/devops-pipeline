name: Deployment Pipeline
on:
    workflow_dispatch:
        inputs:
            environment::
                description: 'Select environment'
                required: true
                type: choice
                options:
                    - dev
                    - sit
                    - uat
                    - pnb
                    - prod
                default: 'dev'
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: Print Selected Environment
              run: |
                echo "Selected environment is : ${{ inputs.environment }}"
